name: news-realtime-project

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: sgu25-bigdata-airflow:local
  profiles:
    - airflow
  restart: unless-stopped
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW_HOME: /opt/airflow
    PROJECT_ROOT: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_TOPIC: news_raw
    KAFKA_DEAD_LETTER_TOPIC: news_dead_letter
    KAFKA_CONSUMER_GROUP: news-raw-to-hdfs-airflow
    KAFKA_AUTO_OFFSET_RESET: latest
    KAFKA_STARTUP_TIMEOUT_SECONDS: "90"
    KAFKA_STARTUP_CHECK_INTERVAL_SECONDS: "3"
    HDFS_URL: http://namenode:9870
    HDFS_DEFAULT_FS: hdfs://namenode:9000
    HDFS_USER: root
    HDFS_RAW_PATH: /news/raw
    HDFS_PROCESSED_PATH: /news/processed
    HDFS_CURATED_PATH: /news/curated
    HDFS_KEYWORDS_PATH: /news/keywords
    ANALYTICS_DB_HOST: postgres-analytics
    ANALYTICS_DB_PORT: "5432"
    ANALYTICS_DB_NAME: analytics
    ANALYTICS_DB_USER: analytics
    ANALYTICS_DB_PASSWORD: analytics
    ANALYTICS_BATCH_HISTORY_TABLE: analytics_load_history
    ANALYTICS_KEYWORD_BATCH_HISTORY_TABLE: analytics_keyword_load_history
    ANALYTICS_ODS_TABLE: ods_news_articles
    ANALYTICS_MART_TABLE: mart_news_daily_source
    ANALYTICS_ARTICLE_KEYWORDS_TABLE: mart_article_keywords
    ANALYTICS_KEYWORD_DAILY_SOURCE_TABLE: mart_keyword_daily_source
    WEBHDFS_REDIRECT_HOST: datanode
    AIRFLOW_RUN_DIR: /tmp
    SPARK_MASTER: local[*]
    SPARK_LOCAL_DIR: /tmp/spark-local
    SPARK_LOCAL_DIRS: /tmp/spark-local
    KEYWORD_SETTINGS_PATH: /opt/airflow/project/config/keyword_settings.json
    KEYWORD_STOPWORDS_PATH: /opt/airflow/project/config/stopwords_vi.txt
    KEYWORD_SOURCE_BLOCKLIST_PATH: /opt/airflow/project/config/source_keyword_blocklist.json
    LOG_JSON: "1"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./:/opt/airflow/project:ro
  depends_on:
    postgres:
      condition: service_healthy
    postgres-analytics:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: namenode
    restart: unless-stopped
    environment:
      CLUSTER_NAME: news-cluster
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode
    restart: unless-stopped
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: namenode:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 1
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
      HDFS_CONF_dfs_datanode_hostname: localhost
      HDFS_CONF_dfs_client_use_datanode_hostname: "true"
      HDFS_CONF_dfs_datanode_use_datanode_hostname: "true"
    ports:
      - "9864:9864"
    volumes:
      - datanode:/hadoop/dfs/data

  postgres:
    image: postgres:16
    hostname: postgres
    profiles:
      - airflow
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-analytics:
    image: postgres:16
    hostname: postgres-analytics
    profiles:
      - airflow
      - dashboard
    restart: unless-stopped
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    ports:
      - "5433:5432"
    volumes:
      - postgres-analytics-db-volume:/var/lib/postgresql/data
      - ./sql/analytics_init.sql:/docker-entrypoint-initdb.d/analytics_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  streamlit-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    profiles:
      - dashboard
    restart: unless-stopped
    environment:
      ANALYTICS_DB_HOST: postgres-analytics
      ANALYTICS_DB_PORT: "5432"
      ANALYTICS_DB_NAME: analytics
      ANALYTICS_DB_USER: analytics
      ANALYTICS_DB_PASSWORD: analytics
      APP_TIMEZONE: Asia/Bangkok
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "8501:8501"
    depends_on:
      postgres-analytics:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    restart: "no"
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username airflow
      --password airflow
      --firstname Airflow
      --lastname Admin
      --role Admin
      --email airflow@example.com || true
      "

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

volumes:
  namenode:
  datanode:
  postgres-db-volume:
  postgres-analytics-db-volume:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">SGU25 BigData Pipeline</title>
  <desc id="desc">Sơ đồ pipeline gồm Nguồn RSS, Apache Kafka, Hadoop HDFS, Apache Spark, PostgreSQL và Apache Airflow điều phối.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef3f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="data-arrow" viewBox="0 -5 10 10" refX="12" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,-5L10,0L0,5" fill="#0288d1"/>
    </marker>
    <marker id="control-arrow" viewBox="0 -5 10 10" refX="12" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,-5L10,0L0,5" fill="#9c27b0"/>
    </marker>
    <style>
      .title { font: 700 28px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; fill: #475569; }
      .docker-box { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; }
      .docker-label { font: italic 700 18px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; fill: #1565c0; }
      .node-stroke { stroke: #d6dee8; stroke-width: 2; }
      .node-label { font: 700 14px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; fill: #1f2937; text-anchor: middle; }
      .node-sub { font: 400 11px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; fill: #64748b; text-anchor: middle; }
      .node-glyph { font: 700 16px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .legend { font: 400 14px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; fill: #334155; }
      .data-link { fill: none; stroke: #0288d1; stroke-width: 4; marker-end: url(#data-arrow); }
      .control-link { fill: none; stroke: #9c27b0; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#control-arrow); }
    </style>
  </defs>

  <rect width="1000" height="620" fill="url(#bg)"/>
  <rect x="36" y="24" width="928" height="572" rx="24" fill="#ffffff" filter="url(#shadow)"/>

  <text class="title" x="500" y="66" text-anchor="middle">SGU25 BigData Pipeline</text>
  <text class="subtitle" x="500" y="92" text-anchor="middle">Luồng dữ liệu từ RSS tới analytics PostgreSQL, được điều phối bằng Apache Airflow</text>

  <rect class="docker-box" x="170" y="178" width="740" height="278" rx="22"/>
  <g transform="translate(198 206)">
    <rect x="-20" y="-18" width="40" height="30" rx="6" fill="#1d63ed"/>
    <rect x="-15" y="-28" width="10" height="8" rx="2" fill="#1d63ed"/>
    <rect x="-2" y="-28" width="10" height="8" rx="2" fill="#1d63ed"/>
    <rect x="11" y="-28" width="10" height="8" rx="2" fill="#1d63ed"/>
    <circle cx="-8" cy="-3" r="3" fill="#ffffff"/>
    <circle cx="4" cy="-3" r="3" fill="#ffffff"/>
    <circle cx="16" cy="-3" r="3" fill="#ffffff"/>
    <path d="M-12 7c7 6 29 6 36 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="docker-label" x="230" y="210">Môi trường Docker Compose</text>

  <line class="data-link" x1="138" y1="320" x2="242" y2="320"/>
  <line class="data-link" x1="318" y1="320" x2="432" y2="320"/>
  <line class="data-link" x1="508" y1="320" x2="622" y2="320"/>
  <line class="data-link" x1="698" y1="320" x2="812" y2="320"/>

  <line class="control-link" x1="560" y1="148" x2="298" y2="250"/>
  <line class="control-link" x1="560" y1="148" x2="488" y2="250"/>
  <line class="control-link" x1="560" y1="148" x2="678" y2="250"/>
  <line class="control-link" x1="560" y1="148" x2="868" y2="250"/>

  <g transform="translate(100 320)">
    <circle r="40" fill="#ff8f00" class="node-stroke"/>
    <text class="node-glyph" x="0" y="1">RSS</text>
    <text class="node-label" x="0" y="64">Nguồn RSS</text>
    <text class="node-sub" x="0" y="81">Feed ingestion</text>
  </g>

  <g transform="translate(280 320)">
    <circle r="40" fill="#ef6c00" class="node-stroke"/>
    <text class="node-glyph" x="0" y="1">K</text>
    <text class="node-label" x="0" y="64">Apache Kafka</text>
    <text class="node-sub" x="0" y="81">Streaming buffer</text>
  </g>

  <g transform="translate(470 320)">
    <circle r="40" fill="#2e7d32" class="node-stroke"/>
    <text class="node-glyph" x="0" y="1">HDFS</text>
    <text class="node-label" x="0" y="64">Hadoop HDFS</text>
    <text class="node-sub" x="0" y="81">Raw / Processed / Curated</text>
  </g>

  <g transform="translate(660 320)">
    <circle r="40" fill="#d84315" class="node-stroke"/>
    <text class="node-glyph" x="0" y="1">SP</text>
    <text class="node-label" x="0" y="64">Apache Spark</text>
    <text class="node-sub" x="0" y="81">Transform &amp; curate</text>
  </g>

  <g transform="translate(850 320)">
    <circle r="40" fill="#0d47a1" class="node-stroke"/>
    <text class="node-glyph" x="0" y="1">PG</text>
    <text class="node-label" x="0" y="64">PostgreSQL</text>
    <text class="node-sub" x="0" y="81">Analytics serving</text>
  </g>

  <g transform="translate(560 118)">
    <circle r="44" fill="#8e24aa" class="node-stroke"/>
    <text class="node-glyph" x="0" y="1">AF</text>
    <text class="node-label" x="0" y="72">Apache Airflow</text>
    <text class="node-sub" x="0" y="89">Orchestration</text>
  </g>

  <g transform="translate(66 546)">
    <line x1="0" y1="0" x2="54" y2="0" stroke="#0288d1" stroke-width="4"/>
    <path d="M54,-5L64,0L54,5" fill="#0288d1"/>
    <text class="legend" x="78" y="5">Luồng dữ liệu (Data Flow)</text>
  </g>

  <g transform="translate(66 576)">
    <line x1="0" y1="0" x2="54" y2="0" stroke="#9c27b0" stroke-width="2.5" stroke-dasharray="7 6"/>
    <path d="M54,-5L64,0L54,5" fill="#9c27b0"/>
    <text class="legend" x="78" y="5">Luồng điều phối (Airflow)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120" role="img" aria-labelledby="title desc">
  <title id="title">SGU25 Big Data Project Data Architecture Diagram</title>
  <desc id="desc">End-to-end data architecture for the news ingestion project, from RSS sources through Kafka, HDFS raw, Spark processed and curated zones, PostgreSQL analytics marts, orchestration, and downstream consumption.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#c2410c"/>
    </marker>
    <style>
      .bg { fill: url(#bg); }
      .banner { fill: url(#banner); rx: 28; ry: 28; }
      .lane {
        fill: #ffffff;
        stroke: #cbd5e1;
        stroke-width: 2;
        rx: 28;
        ry: 28;
      }
      .block {
        fill: #fffaf5;
        stroke: #c2410c;
        stroke-width: 3;
        rx: 22;
        ry: 22;
      }
      .block-blue {
        fill: #f8fbff;
        stroke: #2563eb;
        stroke-width: 3;
        rx: 22;
        ry: 22;
      }
      .block-green {
        fill: #f7fff8;
        stroke: #15803d;
        stroke-width: 3;
        rx: 22;
        ry: 22;
      }
      .block-slate {
        fill: #f8fafc;
        stroke: #334155;
        stroke-width: 3;
        rx: 22;
        ry: 22;
      }
      .mini {
        fill: #ffffff;
        stroke: #94a3b8;
        stroke-width: 2;
        rx: 14;
        ry: 14;
      }
      .flow {
        stroke: #c2410c;
        stroke-width: 7;
        fill: none;
        marker-end: url(#arrow);
      }
      .assist {
        stroke: #475569;
        stroke-width: 4;
        fill: none;
        stroke-dasharray: 10 10;
        marker-end: url(#arrow);
      }
      .title {
        font: 700 34px "Segoe UI", Arial, sans-serif;
        fill: #ffffff;
      }
      .subtitle {
        font: 500 17px "Segoe UI", Arial, sans-serif;
        fill: #cbd5e1;
      }
      .lane-title {
        font: 700 28px "Segoe UI", Arial, sans-serif;
        fill: #0f172a;
      }
      .section-title {
        font: 700 23px "Segoe UI", Arial, sans-serif;
        fill: #111827;
      }
      .body {
        font: 500 16px "Segoe UI", Arial, sans-serif;
        fill: #1f2937;
      }
      .small {
        font: 400 14px "Segoe UI", Arial, sans-serif;
        fill: #475569;
      }
      .tiny {
        font: 400 13px "Segoe UI", Arial, sans-serif;
        fill: #64748b;
      }
      .mono {
        font: 600 14px "Consolas", "Courier New", monospace;
        fill: #0f172a;
      }
      .label {
        font: 600 15px "Segoe UI", Arial, sans-serif;
        fill: #7c2d12;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1900" height="1120" class="bg"/>

  <rect x="50" y="36" width="1800" height="120" class="banner"/>
  <text x="90" y="92" class="title">Data Architecture Diagram</text>
  <text x="90" y="126" class="subtitle">RSS ingestion, Kafka messaging, HDFS lake zones, Spark transformation, curated analytics, PostgreSQL serving, and Airflow orchestration</text>

  <rect x="50" y="190" width="1800" height="150" class="lane"/>
  <text x="90" y="242" class="lane-title">Control And Governance Layer</text>

  <rect x="90" y="266" width="350" height="50" class="mini"/>
  <text x="265" y="297" text-anchor="middle" class="body">Airflow DAG: fetch -> consume -> transform -> curate -> load analytics</text>

  <rect x="470" y="266" width="340" height="50" class="mini"/>
  <text x="640" y="297" text-anchor="middle" class="body">Common modules: schema, data quality, logging, Kafka/HDFS utils</text>

  <rect x="840" y="266" width="330" height="50" class="mini"/>
  <text x="1005" y="297" text-anchor="middle" class="body">Data contract: title, link, summary, published_at, source, fetched_at, ingestion_id</text>

  <rect x="1200" y="266" width="280" height="50" class="mini"/>
  <text x="1340" y="297" text-anchor="middle" class="body">Observability: structured logs, counts, durations, invalid rows</text>

  <rect x="1510" y="266" width="300" height="50" class="mini"/>
  <text x="1660" y="297" text-anchor="middle" class="body">Validation scripts and unit tests for contract and pipeline paths</text>

  <rect x="50" y="374" width="1800" height="680" class="lane"/>
  <text x="90" y="426" class="lane-title">End-To-End Data Flow</text>

  <path class="flow" d="M270 690 H390"/>
  <path class="flow" d="M660 690 H780"/>
  <path class="flow" d="M1050 690 H1170"/>
  <path class="flow" d="M1440 690 H1560"/>

  <path class="assist" d="M265 316 V510"/>
  <path class="assist" d="M640 316 V510"/>
  <path class="assist" d="M1005 316 V510"/>
  <path class="assist" d="M1660 316 V510"/>

  <rect x="90" y="470" width="180" height="440" class="block-slate"/>
  <text x="180" y="520" text-anchor="middle" class="section-title">Sources</text>

  <rect x="115" y="555" width="130" height="56" class="mini"/>
  <text x="180" y="590" text-anchor="middle" class="body">RSS feeds</text>

  <rect x="115" y="630" width="130" height="52" class="mini"/>
  <text x="180" y="662" text-anchor="middle" class="small">VNExpress</text>

  <rect x="115" y="698" width="130" height="52" class="mini"/>
  <text x="180" y="730" text-anchor="middle" class="small">VTV</text>

  <rect x="115" y="770" width="130" height="110" class="mini"/>
  <text x="180" y="804" text-anchor="middle" class="small">Source config</text>
  <text x="180" y="832" text-anchor="middle" class="mono">config/sources.json</text>
  <text x="180" y="858" text-anchor="middle" class="tiny">feed URL + source label</text>

  <rect x="390" y="470" width="270" height="440" class="block"/>
  <text x="525" y="520" text-anchor="middle" class="section-title">Ingestion And Messaging</text>

  <rect x="420" y="555" width="210" height="82" class="mini"/>
  <text x="525" y="588" text-anchor="middle" class="small">Producer</text>
  <text x="525" y="614" text-anchor="middle" class="mono">producer/run_producer.py</text>

  <rect x="420" y="660" width="210" height="88" class="mini"/>
  <text x="525" y="694" text-anchor="middle" class="small">Kafka topic</text>
  <text x="525" y="721" text-anchor="middle" class="mono">news_raw</text>
  <text x="525" y="744" text-anchor="middle" class="tiny">message key = normalized link</text>

  <rect x="420" y="772" width="210" height="56" class="mini"/>
  <text x="525" y="806" text-anchor="middle" class="mono">news_dead_letter</text>

  <rect x="420" y="846" width="210" height="46" class="mini"/>
  <text x="525" y="875" text-anchor="middle" class="tiny">normalize + validate + dedupe + publish</text>

  <rect x="780" y="470" width="270" height="440" class="block-blue"/>
  <text x="915" y="520" text-anchor="middle" class="section-title">Lakehouse Zones In HDFS</text>

  <rect x="810" y="555" width="210" height="88" class="mini"/>
  <text x="915" y="590" text-anchor="middle" class="small">Raw zone</text>
  <text x="915" y="617" text-anchor="middle" class="mono">/news/raw/YYYY/MM/DD/</text>
  <text x="915" y="640" text-anchor="middle" class="tiny">JSON Lines files</text>

  <rect x="810" y="664" width="210" height="88" class="mini"/>
  <text x="915" y="699" text-anchor="middle" class="small">Processed zone</text>
  <text x="915" y="726" text-anchor="middle" class="mono">/news/processed/YYYY/MM/DD/</text>
  <text x="915" y="749" text-anchor="middle" class="tiny">Parquet batch folders</text>

  <rect x="810" y="773" width="210" height="94" class="mini"/>
  <text x="915" y="808" text-anchor="middle" class="small">Curated zone</text>
  <text x="915" y="835" text-anchor="middle" class="mono">/news/curated/YYYY/MM/DD/</text>
  <text x="915" y="858" text-anchor="middle" class="tiny">partitioned by event_date, source</text>

  <path class="assist" d="M525 748 C525 800, 720 800, 780 800"/>
  <text x="620" y="788" class="label">consumer writes raw files</text>

  <rect x="1170" y="470" width="270" height="440" class="block-green"/>
  <text x="1305" y="520" text-anchor="middle" class="section-title">Processing Layer</text>

  <rect x="1200" y="555" width="210" height="88" class="mini"/>
  <text x="1305" y="590" text-anchor="middle" class="small">Kafka consumer to HDFS</text>
  <text x="1305" y="617" text-anchor="middle" class="mono">consumer/kafka_consumer_to_hdfs.py</text>
  <text x="1305" y="640" text-anchor="middle" class="tiny">manual offset commit + DLQ routing</text>

  <rect x="1200" y="664" width="210" height="88" class="mini"/>
  <text x="1305" y="699" text-anchor="middle" class="small">Spark transform</text>
  <text x="1305" y="726" text-anchor="middle" class="mono">transform_news_raw_to_processed.py</text>
  <text x="1305" y="749" text-anchor="middle" class="tiny">JSONL -> Parquet + event_date + dedupe(link)</text>

  <rect x="1200" y="773" width="210" height="88" class="mini"/>
  <text x="1305" y="808" text-anchor="middle" class="small">Spark curate</text>
  <text x="1305" y="835" text-anchor="middle" class="mono">curate_news_processed_to_curated.py</text>
  <text x="1305" y="858" text-anchor="middle" class="tiny">analytics-ready partitions</text>

  <rect x="1200" y="880" width="210" height="46" class="mini"/>
  <text x="1305" y="909" text-anchor="middle" class="tiny">validation scripts verify raw, processed, curated outputs</text>

  <rect x="1560" y="470" width="240" height="440" class="block-slate"/>
  <text x="1680" y="520" text-anchor="middle" class="section-title">Analytics Serving</text>

  <rect x="1585" y="555" width="190" height="88" class="mini"/>
  <text x="1680" y="590" text-anchor="middle" class="small">Loader</text>
  <text x="1680" y="617" text-anchor="middle" class="mono">scripts/load_curated_to_postgres.py</text>
  <text x="1680" y="640" text-anchor="middle" class="tiny">idempotent per curated batch</text>

  <rect x="1585" y="664" width="190" height="78" class="mini"/>
  <text x="1680" y="699" text-anchor="middle" class="small">Batch history</text>
  <text x="1680" y="724" text-anchor="middle" class="mono">analytics_load_history</text>

  <rect x="1585" y="761" width="190" height="78" class="mini"/>
  <text x="1680" y="796" text-anchor="middle" class="small">ODS table</text>
  <text x="1680" y="821" text-anchor="middle" class="mono">ods_news_articles</text>

  <rect x="1585" y="858" width="190" height="78" class="mini"/>
  <text x="1680" y="893" text-anchor="middle" class="small">MART table</text>
  <text x="1680" y="918" text-anchor="middle" class="mono">mart_news_daily_source</text>

  <rect x="1520" y="954" width="320" height="70" class="mini"/>
  <text x="1680" y="985" text-anchor="middle" class="small">Consumption</text>
  <text x="1680" y="1012" text-anchor="middle" class="tiny">psql today, BI / FastAPI / dashboard next</text>

  <text x="330" y="674" class="label">RSS records</text>
  <text x="720" y="674" class="label">validated events</text>
  <text x="1090" y="674" class="label">zone promotion</text>
  <text x="1480" y="674" class="label">serving tables</text>

  <text x="116" y="948" class="tiny">Runtime: Docker services include Kafka, ZooKeeper, NameNode, DataNode, Airflow, PostgreSQL analytics.</text>
  <text x="116" y="975" class="tiny">Current serving boundary ends at PostgreSQL marts; API and dashboard can be added on top without changing upstream contracts.</text>
  <text x="116" y="1002" class="tiny">This diagram reflects the implemented project flow, not a future-state proposal.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
  <title id="title">SGU25 Big Data Pipeline Architecture Components</title>
  <desc id="desc">Architecture components diagram with data sources, ingestion and messaging, HDFS data lake, Spark compute engine, and supporting environment blocks.</desc>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#d97706"/>
    </marker>
    <style>
      .bg { fill: #eeeeee; }
      .axis { stroke: #d97706; stroke-width: 7; fill: none; marker-end: url(#arrow); }
      .flow { stroke: #d97706; stroke-width: 10; fill: none; marker-end: url(#arrow); }
      .panel {
        fill: #f9f9f9;
        stroke: #b45309;
        stroke-width: 3;
        rx: 18;
        ry: 18;
      }
      .title { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 18px "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 15px "Segoe UI", Arial, sans-serif; fill: #374151; }
      .tiny { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .chip {
        fill: #ffffff;
        stroke: #d97706;
        stroke-width: 2;
        rx: 10;
        ry: 10;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1700" height="900" class="bg"/>

  <path class="axis" d="M40 860 V40"/>
  <path class="axis" d="M40 860 H1645"/>
  <text x="62" y="826" class="subtitle">Apache Airflow Orchestration Layer</text>

  <!-- Main flow arrows -->
  <path class="flow" d="M330 360 H400"/>
  <path class="flow" d="M700 360 H770"/>
  <path class="flow" d="M1070 360 H1140"/>

  <!-- Block 1: Data sources -->
  <rect x="90" y="70" width="240" height="660" class="panel"/>
  <text x="210" y="118" text-anchor="middle" class="title">Data Sources</text>
  <rect x="120" y="150" width="180" height="54" class="chip"/>
  <text x="210" y="184" text-anchor="middle" class="subtitle">RSS Feeds</text>

  <rect x="120" y="228" width="180" height="50" class="chip"/>
  <text x="210" y="259" text-anchor="middle" class="small">VNExpress</text>
  <rect x="120" y="292" width="180" height="50" class="chip"/>
  <text x="210" y="323" text-anchor="middle" class="small">VTV</text>

  <rect x="120" y="384" width="180" height="100" class="chip"/>
  <text x="210" y="417" text-anchor="middle" class="small">Input format</text>
  <text x="210" y="442" text-anchor="middle" class="tiny">XML / RSS entry</text>
  <text x="210" y="466" text-anchor="middle" class="tiny">title, link, summary</text>

  <rect x="120" y="514" width="180" height="140" class="chip"/>
  <text x="210" y="548" text-anchor="middle" class="small">Source config</text>
  <text x="210" y="574" text-anchor="middle" class="tiny">config/sources.json</text>
  <text x="210" y="598" text-anchor="middle" class="tiny">refresh by schedule</text>
  <text x="210" y="622" text-anchor="middle" class="tiny">or manual trigger</text>

  <!-- Block 2: Ingestion and messaging -->
  <rect x="400" y="70" width="300" height="660" class="panel"/>
  <text x="550" y="118" text-anchor="middle" class="title">Ingestion &amp; Messaging</text>

  <rect x="430" y="150" width="240" height="74" class="chip"/>
  <text x="550" y="183" text-anchor="middle" class="small">producer/run_producer.py</text>
  <text x="550" y="207" text-anchor="middle" class="tiny">normalize + validate + dedupe</text>

  <rect x="430" y="248" width="240" height="86" class="chip"/>
  <text x="550" y="282" text-anchor="middle" class="small">Kafka Topic: news_raw</text>
  <text x="550" y="307" text-anchor="middle" class="tiny">key = normalized link</text>

  <rect x="430" y="356" width="240" height="110" class="chip"/>
  <text x="550" y="390" text-anchor="middle" class="small">consumer/kafka_consumer_to_hdfs.py</text>
  <text x="550" y="415" text-anchor="middle" class="tiny">manual offset commit</text>
  <text x="550" y="439" text-anchor="middle" class="tiny">file pattern: news_HHMMSSffffff.jsonl</text>

  <rect x="430" y="490" width="240" height="70" class="chip"/>
  <text x="550" y="523" text-anchor="middle" class="small">Kafka Topic: news_dead_letter</text>
  <text x="550" y="547" text-anchor="middle" class="tiny">invalid payload + errors</text>

  <rect x="430" y="584" width="240" height="70" class="chip"/>
  <text x="550" y="616" text-anchor="middle" class="small">Structured Logging</text>
  <text x="550" y="640" text-anchor="middle" class="tiny">row_count, invalid_count, duration_ms</text>

  <!-- Block 3: Data lake -->
  <rect x="770" y="70" width="300" height="660" class="panel"/>
  <text x="920" y="118" text-anchor="middle" class="title">Data Lake (HDFS)</text>

  <rect x="800" y="160" width="240" height="96" class="chip"/>
  <text x="920" y="194" text-anchor="middle" class="small">Raw Zone</text>
  <text x="920" y="219" text-anchor="middle" class="tiny">/news/raw/YYYY/MM/DD/</text>
  <text x="920" y="243" text-anchor="middle" class="tiny">news_HHMMSSffffff.jsonl</text>

  <rect x="800" y="290" width="240" height="96" class="chip"/>
  <text x="920" y="324" text-anchor="middle" class="small">Processed Zone</text>
  <text x="920" y="349" text-anchor="middle" class="tiny">/news/processed/YYYY/MM/DD/</text>
  <text x="920" y="373" text-anchor="middle" class="tiny">news_HHMMSSffffff/</text>

  <rect x="800" y="420" width="240" height="96" class="chip"/>
  <text x="920" y="454" text-anchor="middle" class="small">Curated Zone</text>
  <text x="920" y="479" text-anchor="middle" class="tiny">/news/curated/YYYY/MM/DD/</text>
  <text x="920" y="503" text-anchor="middle" class="tiny">partition by event_date, source</text>

  <rect x="800" y="552" width="240" height="120" class="chip"/>
  <text x="920" y="586" text-anchor="middle" class="small">Validation Scripts</text>
  <text x="920" y="611" text-anchor="middle" class="tiny">validate_hdfs_output.py</text>
  <text x="920" y="635" text-anchor="middle" class="tiny">validate_processed_output.py</text>
  <text x="920" y="659" text-anchor="middle" class="tiny">validate_curated_output.py</text>

  <!-- Block 4: Compute engine -->
  <rect x="1140" y="70" width="300" height="660" class="panel"/>
  <text x="1290" y="118" text-anchor="middle" class="title">Compute Engine</text>

  <rect x="1170" y="150" width="240" height="74" class="chip"/>
  <text x="1290" y="184" text-anchor="middle" class="subtitle">Apache Spark</text>
  <text x="1290" y="208" text-anchor="middle" class="tiny">local[*] / containerized runtime</text>

  <rect x="1170" y="248" width="240" height="90" class="chip"/>
  <text x="1290" y="281" text-anchor="middle" class="small">Transform Job</text>
  <text x="1290" y="306" text-anchor="middle" class="tiny">raw JSONL -> processed Parquet</text>
  <text x="1290" y="330" text-anchor="middle" class="tiny">event_date + dedupe(link)</text>

  <rect x="1170" y="362" width="240" height="90" class="chip"/>
  <text x="1290" y="395" text-anchor="middle" class="small">Curate Job</text>
  <text x="1290" y="420" text-anchor="middle" class="tiny">processed -> curated Parquet</text>
  <text x="1290" y="444" text-anchor="middle" class="tiny">partition(event_date, source)</text>

  <rect x="1170" y="476" width="240" height="90" class="chip"/>
  <text x="1290" y="509" text-anchor="middle" class="small">Quality Metrics</text>
  <text x="1290" y="534" text-anchor="middle" class="tiny">missing title/link, duplicates</text>
  <text x="1290" y="558" text-anchor="middle" class="tiny">articles by source</text>

  <rect x="1170" y="590" width="240" height="78" class="chip"/>
  <text x="1290" y="622" text-anchor="middle" class="small">Output for Analytics</text>
  <text x="1290" y="646" text-anchor="middle" class="tiny">batch-ready curated dataset</text>

  <!-- Right support column -->
  <rect x="1470" y="70" width="200" height="190" class="panel"/>
  <text x="1570" y="112" text-anchor="middle" class="title">Development</text>
  <text x="1570" y="152" text-anchor="middle" class="small">WSL/Linux</text>
  <text x="1570" y="179" text-anchor="middle" class="small">Python venv</text>
  <text x="1570" y="206" text-anchor="middle" class="small">Jupyter (optional)</text>
  <text x="1570" y="233" text-anchor="middle" class="small">Docker Desktop</text>

  <rect x="1470" y="290" width="200" height="190" class="panel"/>
  <text x="1570" y="332" text-anchor="middle" class="title">Orchestration</text>
  <text x="1570" y="372" text-anchor="middle" class="small">Airflow DAG</text>
  <text x="1570" y="399" text-anchor="middle" class="tiny">fetch -> consume -> transform</text>
  <text x="1570" y="423" text-anchor="middle" class="tiny">validate -> curate -> validate</text>
  <text x="1570" y="451" text-anchor="middle" class="small">retry + backoff</text>

  <rect x="1470" y="510" width="200" height="220" class="panel"/>
  <text x="1570" y="552" text-anchor="middle" class="title">CI / QA</text>
  <text x="1570" y="590" text-anchor="middle" class="small">unittest suite</text>
  <text x="1570" y="617" text-anchor="middle" class="small">17 tests passing</text>
  <text x="1570" y="646" text-anchor="middle" class="tiny">schema + kafka + hdfs utils</text>
  <text x="1570" y="670" text-anchor="middle" class="tiny">transform/curated path tests</text>
  <text x="1570" y="700" text-anchor="middle" class="small">smoke test scripts</text>

  <!-- Connector from compute to support -->
  <path d="M1440 360 L1460 320 L1460 400 Z" fill="#d97706" stroke="#b45309" stroke-width="2"/>
</svg>

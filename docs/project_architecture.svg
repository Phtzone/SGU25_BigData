<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">SGU25 Big Data News Pipeline Architecture</title>
  <desc id="desc">Architecture diagram showing RSS sources flowing through producer validation, Kafka messaging, HDFS raw processed curated zones, and an Airflow orchestration layer with logging, quality checks, Docker, and tests.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#f4f8fb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #172554; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #b45309; stroke-width: 3; rx: 22; ry: 22; }
      .panelTitle { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .sectionText { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .sectionSmall { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .chipText { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .bandTitle { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .bandText { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; }
      .arrowLine { stroke: #d97706; stroke-width: 10; fill: none; marker-end: url(#arrow); }
      .dashedArrow { stroke: #dc2626; stroke-width: 6; fill: none; stroke-dasharray: 14 10; marker-end: url(#arrow); }
      .boxShadow { fill: #ffffff; stroke: #d97706; stroke-width: 2; rx: 14; ry: 14; }
      .chip { rx: 14; ry: 14; stroke-width: 2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="860" fill="url(#bg)"/>

  <text x="60" y="58" class="title">SGU25 Big Data News Pipeline</text>
  <text x="60" y="88" class="subtitle">RSS ingestion, Kafka streaming, HDFS data lake zones, Spark transformation, Airflow orchestration, and operational controls</text>

  <path class="arrowLine" d="M290 300 H340"/>
  <path class="arrowLine" d="M600 300 H650"/>
  <path class="arrowLine" d="M910 300 H960"/>

  <rect x="60" y="130" width="230" height="390" class="panel"/>
  <text x="175" y="172" text-anchor="middle" class="panelTitle">Data Sources</text>
  <rect x="92" y="205" width="166" height="54" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" rx="14" ry="14"/>
  <text x="175" y="238" text-anchor="middle" class="chipText">RSS Feeds</text>
  <text x="175" y="282" text-anchor="middle" class="sectionText">VNExpress</text>
  <text x="175" y="316" text-anchor="middle" class="sectionText">Tuoi Tre</text>
  <text x="175" y="350" text-anchor="middle" class="sectionText">VTV</text>
  <text x="175" y="404" text-anchor="middle" class="sectionSmall">Configured in</text>
  <text x="175" y="428" text-anchor="middle" class="sectionText">config/sources.json</text>
  <text x="175" y="468" text-anchor="middle" class="sectionSmall">Input format</text>
  <text x="175" y="492" text-anchor="middle" class="sectionText">XML / RSS entries</text>

  <rect x="340" y="110" width="260" height="430" class="panel"/>
  <text x="470" y="152" text-anchor="middle" class="panelTitle">Producer Layer</text>
  <rect x="372" y="185" width="196" height="54" fill="#fff7ed" stroke="#f97316" stroke-width="2" rx="14" ry="14"/>
  <text x="470" y="218" text-anchor="middle" class="chipText">producer/run_producer.py</text>
  <text x="470" y="274" text-anchor="middle" class="sectionText">feedparser fetch</text>
  <text x="470" y="306" text-anchor="middle" class="sectionText">normalize_entry</text>
  <text x="470" y="338" text-anchor="middle" class="sectionText">validate_article_record</text>
  <text x="470" y="370" text-anchor="middle" class="sectionText">deduplicate_articles</text>
  <text x="470" y="416" text-anchor="middle" class="sectionSmall">Message key</text>
  <text x="470" y="442" text-anchor="middle" class="sectionText">normalized link</text>
  <text x="470" y="480" text-anchor="middle" class="sectionSmall">Quality metrics</text>
  <text x="470" y="504" text-anchor="middle" class="sectionText">missing fields, duplicates,</text>
  <text x="470" y="526" text-anchor="middle" class="sectionText">articles by source, zero-alert</text>

  <rect x="650" y="110" width="260" height="430" class="panel"/>
  <text x="780" y="152" text-anchor="middle" class="panelTitle">Kafka Messaging</text>
  <rect x="690" y="194" width="180" height="76" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="16" ry="16"/>
  <text x="780" y="228" text-anchor="middle" class="chipText">news_raw</text>
  <text x="780" y="252" text-anchor="middle" class="sectionSmall">main ingestion topic</text>
  <text x="780" y="318" text-anchor="middle" class="sectionSmall">Consumer group</text>
  <text x="780" y="344" text-anchor="middle" class="sectionText">news-raw-to-hdfs-v1</text>
  <rect x="690" y="402" width="180" height="78" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="16" ry="16"/>
  <text x="780" y="436" text-anchor="middle" class="chipText">news_dead_letter</text>
  <text x="780" y="460" text-anchor="middle" class="sectionSmall">invalid payload + errors</text>
  <path class="dashedArrow" d="M780 270 V396"/>
  <text x="806" y="330" class="sectionSmall" fill="#991b1b">schema failures</text>

  <rect x="960" y="70" width="370" height="500" class="panel"/>
  <text x="1145" y="112" text-anchor="middle" class="panelTitle">HDFS Data Lake + Spark</text>

  <rect x="995" y="148" width="300" height="82" fill="#fff7ed" stroke="#f97316" stroke-width="2" rx="16" ry="16"/>
  <text x="1145" y="182" text-anchor="middle" class="chipText">Raw Zone</text>
  <text x="1145" y="206" text-anchor="middle" class="sectionText">/news/raw/YYYY/MM/DD/news_HHMMSS.jsonl</text>

  <path class="arrowLine" d="M1145 230 V282"/>
  <rect x="1018" y="292" width="254" height="74" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="16" ry="16"/>
  <text x="1145" y="325" text-anchor="middle" class="chipText">Spark Transform</text>
  <text x="1145" y="349" text-anchor="middle" class="sectionSmall">raw JSONL to typed Parquet</text>

  <path class="arrowLine" d="M1145 366 V420"/>
  <rect x="995" y="430" width="300" height="82" fill="#ecfeff" stroke="#0891b2" stroke-width="2" rx="16" ry="16"/>
  <text x="1145" y="464" text-anchor="middle" class="chipText">Processed Zone</text>
  <text x="1145" y="488" text-anchor="middle" class="sectionText">/news/processed/YYYY/MM/DD/news_HHMMSS/</text>

  <path class="arrowLine" d="M1145 512 V564"/>
  <rect x="1018" y="574" width="254" height="74" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" rx="16" ry="16"/>
  <text x="1145" y="607" text-anchor="middle" class="chipText">Spark Curated Job</text>
  <text x="1145" y="631" text-anchor="middle" class="sectionSmall">partition by event_date and source</text>

  <path class="arrowLine" d="M1145 648 V700"/>
  <rect x="995" y="710" width="300" height="82" fill="#f0fdf4" stroke="#15803d" stroke-width="2" rx="16" ry="16"/>
  <text x="1145" y="744" text-anchor="middle" class="chipText">Curated Zone</text>
  <text x="1145" y="768" text-anchor="middle" class="sectionText">/news/curated/YYYY/MM/DD/news_HHMMSS/</text>

  <rect x="1360" y="130" width="190" height="390" class="panel"/>
  <text x="1455" y="172" text-anchor="middle" class="panelTitle">Ops Layer</text>
  <rect x="1386" y="206" width="138" height="52" fill="#f1f5f9" stroke="#334155" stroke-width="2" rx="14" ry="14"/>
  <text x="1455" y="238" text-anchor="middle" class="chipText">Docker Compose</text>
  <rect x="1386" y="282" width="138" height="52" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="14" ry="14"/>
  <text x="1455" y="314" text-anchor="middle" class="chipText">Airflow DAG</text>
  <rect x="1386" y="358" width="138" height="52" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="14" ry="14"/>
  <text x="1455" y="390" text-anchor="middle" class="chipText">Validators</text>
  <rect x="1386" y="434" width="138" height="52" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="14" ry="14"/>
  <text x="1455" y="466" text-anchor="middle" class="chipText">Unit Tests</text>
  <text x="1455" y="506" text-anchor="middle" class="sectionSmall">logging + quality +</text>
  <text x="1455" y="530" text-anchor="middle" class="sectionSmall">runtime verification</text>

  <rect x="60" y="600" width="1490" height="190" fill="#172554" stroke="#0f172a" stroke-width="3" rx="22" ry="22"/>
  <text x="92" y="642" class="bandTitle">Control Plane And Cross-Cutting Concerns</text>
  <text x="92" y="678" class="bandText">Airflow orchestration:</text>
  <text x="270" y="678" class="bandText">fetch_and_publish_articles -> consume_kafka_to_raw_zone -> transform_raw_to_processed_zone -> validate_processed_zone -> curate_processed_to_curated_zone -> validate_curated_zone</text>
  <text x="92" y="716" class="bandText">Structured logging:</text>
  <text x="258" y="716" class="bandText">JSON or key-value logs with source, topic, row_count, invalid_count, output_path, duration_ms, status</text>
  <text x="92" y="752" class="bandText">Data quality + reliability:</text>
  <text x="320" y="752" class="bandText">missing title/link rates, duplicate counts, articles by source, zero-article warning, Kafka retries, dead-letter routing</text>
</svg>
